name: mobike
description: Mobike (Chinese 摩拜单车 / 摩拜科技, "Mobike Technology") was a Beijing-based
  dockless bicycle-sharing company founded in 2015. Riders located, unlocked, and paid
  for GPS smart-lock bikes through a mobile app and QR codes. Mobike was acquired by
  Meituan in 2018 and its standalone brand was subsequently folded into Meituan Bike;
  the public site (www.mobike.com) is now a bare ICP-filing landing page with no
  developer API, SDK, documentation, or portal surface. It is tracked in the API
  Evangelist network as a portfolio company of Qiming Venture Partners.
